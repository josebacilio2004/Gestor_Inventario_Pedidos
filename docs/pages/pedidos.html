<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Sistema de Gestión de Inventario</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/corporate-theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../assets/favicon.png">
</head>

<body>
    <!-- Navegación -->
    <div id="dynamic-nav"></div>

    <!-- Contenido Principal -->
    <main class="container">
        <div class="card-header mb-2">
            <div class="d-flex justify-between align-center">
                <div>
                    <h1 class="card-title">📋 Gestión de Pedidos</h1>
                    <p class="text-secondary">Registra y monitorea tus pedidos de inventario</p>
                </div>
                <button class="btn btn-primary" onclick="openCreateModal()">
                    ➕ Nuevo Pedido
                </button>
            </div>
        </div>

        <!-- Filtros -->
        <div class="card mb-2">
            <div class="d-flex gap-1 align-center">
                <div class="form-group" style="margin: 0; flex: 1;">
                    <select id="filter-estado" class="form-control" onchange="loadPedidos()">
                        <option value="">Todos los estados</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="completado">Completado</option>
                        <option value="cancelado">Cancelado</option>
                    </select>
                </div>
                <button class="btn btn-secondary" onclick="resetFilters()">
                    🔄 Limpiar Filtros
                </button>
            </div>
        </div>

        <!-- Tabla de Pedidos -->
        <div class="card">
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Fecha</th>
                            <th>Producto</th>
                            <th>Distribuidor</th>
                            <th>Cantidad</th>
                            <th>Capital</th>
                            <th>Ganancia</th>
                            <th>✓ Ganancia</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="pedidos-table-body">
                        <tr>
                            <td colspan="10" class="text-center loading">Cargando pedidos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Crear/Editar Pedido -->
    <div id="pedido-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Nuevo Pedido</h2>
                <button class="close-btn" onclick="closeModal('pedido-modal')">×</button>
            </div>
            <form id="pedido-form">
                <input type="hidden" id="pedido-id">

                <div class="form-group">
                    <label for="fecha_pedido" class="form-label">Fecha del Pedido *</label>
                    <input type="date" id="fecha_pedido" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="producto_id" class="form-label">Producto *</label>
                    <select id="producto_id" class="form-control" required>
                        <option value="">Seleccione un producto</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="distribuidor_id" class="form-label">Distribuidor *</label>
                    <select id="distribuidor_id" class="form-control" required>
                        <option value="">Seleccione un distribuidor</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="inversionista_id" class="form-label">💰 Inversionista *</label>
                    <select id="inversionista_id" class="form-control" required>
                        <option value="">Seleccione un inversionista</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="comprador_id" class="form-label">🛒 Comprador Principal *</label>
                    <select id="comprador_id" class="form-control" required>
                        <option value="">Seleccione un comprador</option>
                    </select>
                </div>

                <!-- Builder de Productos -->
                <div
                    style="background: #f8fafc; padding: 1rem; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 1rem;">
                    <h3 style="font-size: 0.95rem; margin-bottom: 0.75rem; color: #1a365d;">🛠️ Agregar Productos al
                        Pedido</h3>
                    <div class="d-flex gap-1 align-items-end">
                        <div class="form-group flex-1">
                            <label class="form-label">Producto</label>
                            <select id="producto_id" class="form-control"></select>
                        </div>
                        <div class="form-group" style="width: 100px;">
                            <label class="form-label">Cantidad</label>
                            <input type="number" id="item_cantidad" class="form-control" min="1" placeholder="0">
                        </div>
                        <button type="button" class="btn btn-primary" onclick="agregarItemALista()"
                            style="height: 38px; margin-bottom: 15px;">
                            ➕ Añadir
                        </button>
                    </div>

                    <!-- Lista de productos añadidos -->
                    <div id="lista-items-productos"
                        style="margin-top: 1rem; border-top: 1px solid #e2e8f0; padding-top: 0.75rem;">
                        <div class="text-secondary text-center" style="font-size: 0.85rem; padding: 0.5rem;">
                            No hay productos añadidos aún
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="cantidad" class="form-label">Cantidad Total de Herramientas *</label>
                    <input type="number" id="cantidad" class="form-control" required min="1" placeholder="0" readonly>
                    <small class="text-secondary">Se calcula automáticamente al añadir productos</small>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="capital_invertido" class="form-label">Capital Invertido *</label>
                            <input type="number" id="capital_invertido" class="form-control" required min="0"
                                step="0.01" placeholder="0.00">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="ganancia_esperada" class="form-label">Ganancia Neta *</label>
                            <input type="number" id="ganancia_esperada" class="form-control" required min="0"
                                step="0.01" placeholder="0.00">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="estado" class="form-label">Estado *</label>
                    <select id="estado" class="form-control" required>
                        <option value="pendiente">Pendiente</option>
                        <option value="completado">Completado</option>
                        <option value="cancelado">Cancelado</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="notas" class="form-label">Notas</label>
                    <textarea id="notas" class="form-control" rows="2"
                        placeholder="Notas adicionales sobre el pedido"></textarea>
                </div>

                <div class="d-flex gap-1 mt-2">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <button type="button" class="btn btn-secondary"
                        onclick="closeModal('pedido-modal')">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/navigation.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/pedidos.js"></script>
</body>

</html>
