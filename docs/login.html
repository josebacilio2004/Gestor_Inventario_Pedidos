<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestión</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/corporate-theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
            background: linear-gradient(135deg, #0f2442 0%, #1a365d 50%, #1e4a8a 100%);
        }

        .login-container {
            width: 100%;
            max-width: 460px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #1a365d, #f97316, #1a365d);
        }

        /* === HEADER === */
        .login-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .login-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #1a365d;
            padding: 10px;
            margin: 0 auto 0.875rem;
            display: block;
            box-shadow: 0 8px 20px rgba(26, 54, 93, 0.3);
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1a365d;
            margin: 0 0 0.25rem;
            background: none;
            -webkit-background-clip: unset;
            -webkit-text-fill-color: #1a365d;
            background-clip: unset;
        }

        .login-subtitle {
            color: #64748b;
            font-size: 0.875rem;
            margin: 0;
        }

        /* === ROL SELECTOR 2x2 === */
        .role-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #94a3b8;
            margin-bottom: 0.625rem;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.625rem;
            margin-bottom: 1.5rem;
        }

        .role-btn {
            padding: 0.875rem 0.5rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            color: #64748b;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.35rem;
            font-family: 'Inter', sans-serif;
        }

        .role-btn:hover {
            border-color: #1a365d;
            background: #eff6ff;
            color: #1a365d;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 54, 93, 0.15);
        }

        .role-btn.active {
            border-color: #1a365d;
            background: linear-gradient(135deg, #1a365d, #2563eb);
            color: white;
            box-shadow: 0 6px 16px rgba(26, 54, 93, 0.35);
            transform: translateY(-2px);
        }

        .role-icon {
            font-size: 1.5rem;
            line-height: 1;
        }

        .role-name {
            font-size: 0.78rem;
            font-weight: 600;
        }

        /* === FORM === */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.375rem;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            color: #1e293b;
            transition: border-color 0.2s;
            outline: none;
        }

        .form-control:focus {
            border-color: #1a365d;
        }

        .btn-login {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(135deg, #1a365d, #2563eb);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
            font-family: 'Inter', sans-serif;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #0f2442, #1a365d);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(26, 54, 93, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* === ERROR === */
        .error-message {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #dc2626;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.4s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            75% {
                transform: translateX(8px);
            }
        }

        /* === FOOTER LINK === */
        .admin-link {
            text-align: center;
            margin-top: 1.25rem;
            padding-top: 1.25rem;
            border-top: 1px solid #e2e8f0;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .admin-link a {
            color: #1a365d;
            text-decoration: none;
            font-weight: 600;
        }

        .admin-link a:hover {
            text-decoration: underline;
        }

        /* === RESPONSIVE === */
        @media (max-width: 480px) {
            body {
                padding: 0.75rem;
                align-items: flex-start;
                padding-top: 2rem;
            }

            .login-card {
                padding: 1.5rem 1.25rem;
                border-radius: 16px;
            }

            .login-title {
                font-size: 1.25rem;
            }

            .login-logo {
                width: 56px;
                height: 56px;
            }

            .role-btn {
                padding: 0.75rem 0.25rem;
            }

            .role-icon {
                font-size: 1.25rem;
            }

            .role-name {
                font-size: 0.72rem;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="assets/logo.png" alt="ALY" class="login-logo"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                <div style="display:none; font-size:3rem; margin-bottom:0.875rem;">🏪</div>
                <h1 class="login-title">Comercializadora ALY</h1>
                <p class="login-subtitle">Sistema de Gestión de Capital e Inventario</p>
            </div>

            <p class="role-label">Selecciona tu rol</p>
            <div class="role-selector">
                <button type="button" class="role-btn" onclick="selectRole('inversionista')">
                    <span class="role-icon">💰</span>
                    <span class="role-name">Inversionista</span>
                </button>
                <button type="button" class="role-btn" onclick="selectRole('comprador')">
                    <span class="role-icon">🛒</span>
                    <span class="role-name">Comprador</span>
                </button>
                <button type="button" class="role-btn" onclick="selectRole('operador')">
                    <span class="role-icon">🔧</span>
                    <span class="role-name">Operador</span>
                </button>
                <button type="button" class="role-btn active" onclick="selectRole('admin')">
                    <span class="role-icon">👨‍💼</span>
                    <span class="role-name">Administrador</span>
                </button>
            </div>

            <div id="error-message" class="error-message"></div>

            <form id="login-form">
                <input type="hidden" id="role" value="admin">

                <div class="form-group">
                    <label for="usuario" class="form-label">Usuario</label>
                    <input type="text" id="usuario" class="form-control" required placeholder="Ingresa tu usuario"
                        autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control" required
                        placeholder="Ingresa tu contraseña" autocomplete="current-password">
                </div>

                <button type="submit" class="btn-login">
                    🔐 Iniciar Sesión
                </button>
            </form>

            <div class="admin-link">
                <a href="dashboard.html">💼 Acceso Administrativo (Sin autenticación)</a>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script>
        let currentRole = 'inversionista';

        function selectRole(role) {
            currentRole = role;
            document.getElementById('role').value = role;

            // Update UI
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.closest('.role-btn').classList.add('active');

            // Clear error
            hideError();
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        function hideError() {
            const errorDiv = document.getElementById('error-message');
            errorDiv.classList.remove('show');
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            console.log('=== LOGIN ATTEMPT ===');
            console.log('Usuario:', usuario);
            console.log('Rol:', role);

            try {
                // Admin login separado
                if (currentRole === 'admin') {
                    console.log('Intentando login de admin con endpoint /api/admin/login');
                    const response = await fetch(`${window.API_URL}/api/admin/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ usuario, password })
                    });

                    if (!response.ok) {
                        showError('❌ Credenciales de administrador incorrectas');
                        return;
                    }

                    const admin = await response.json();
                    sessionStorage.setItem('userId', admin.id);
                    sessionStorage.setItem('userName', admin.nombre);
                    sessionStorage.setItem('userRole', 'admin');
                    sessionStorage.setItem('userLogin', admin.usuario);

                    console.log('✅ Admin login exitoso');
                    window.location.href = 'dashboard.html';
                    return;
                } else if (currentRole === 'operador') {
                    const response = await fetch(`${window.API_URL}/api/operadores/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ usuario, password })
                    });
                    if (!response.ok) {
                        showError('❌ Credenciales de operador incorrectas');
                        return;
                    }
                    const operador = await response.json();
                    localStorage.setItem('operador_sesion', JSON.stringify(operador));
                    sessionStorage.setItem('userRole', 'operador');
                    console.log('✅ Operador login exitoso');
                    window.location.href = 'pages/dashboard-operador.html';
                    return;
                } else {
                    // Inversionistas y compradores
                    const endpoint = currentRole === 'inversionista' ? 'inversionistas' : 'compradores';
                    console.log(`Buscando usuario en endpoint: /api/${endpoint}`);

                    const response = await fetch(`${window.API_URL}/api/${endpoint}`);

                    if (!response.ok) {
                        throw new Error('Error de conexión');
                    }

                    const usuarios = await response.json();
                    const user = usuarios.find(u => u.usuario === usuario && u.password_hash === password && u.activo);

                    if (!user) {
                        showError('❌ Usuario o contraseña incorrectos');
                        return;
                    }

                    sessionStorage.setItem('userId', user.id);
                    sessionStorage.setItem('userName', user.nombre);
                    sessionStorage.setItem('userRole', role);
                    sessionStorage.setItem('userLogin', usuario);

                    console.log('✅ Login exitoso');
                    if (role === 'inversionista') {
                        window.location.href = 'dashboard-inversionista.html';
                    } else {
                        window.location.href = 'dashboard-comprador.html';
                    }

                }
            } catch (error) {
                console.error('Error en login:', error);
                showError('⚠️ Error al conectar con el servidor');
            }
        });

        // Clear fields on load
        document.getElementById('usuario').value = '';
        document.getElementById('password').value = '';
    </script>
</body>

</html>
