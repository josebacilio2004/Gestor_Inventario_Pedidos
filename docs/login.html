<!DOCTYPE html>
<html lang="es" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Industrial | Comercializadora ALY</title>

    <!-- UI/UX Assets -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#000919",
                        "primary-container": "#0f2137",
                        "secondary": "#9d4300",
                        "secondary-container": "#fd761a",
                        "on-secondary-container": "#5c2400",
                        "on-surface": "#191c1e",
                        "background": "#f7f9fb",
                        "outline": "#74777d",
                        "outline-variant": "#c4c6cd",
                        "surface-variant": "#e0e3e5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000919;
        }

        .glass-effect {
            background: rgba(15, 33, 55, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hero-gradient {
            background: radial-gradient(circle at center, #0f2137 0%, #000919 100%);
        }

        .role-btn.active {
            border-color: #fd761a;
            background-color: rgba(253, 118, 26, 0.1);
            box-shadow: 0 0 20px rgba(253, 118, 26, 0.3), inset 0 0 10px rgba(253, 118, 26, 0.1);
        }

        .role-btn.active span {
            color: #fd761a !important;
        }

        .role-btn.active .material-symbols-outlined {
            color: #fd761a !important;
            transform: scale(1.1);
        }
    </style>
    <link rel="icon" type="image/png" href="assets/favicon.png">
</head>

<body class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden text-surface-variant">
    
    <!-- Background Industrial -->
    <div class="absolute inset-0 z-0">
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCGfIk9iAxz8SY4DlQVqv5563lQbTc5nBILljU1tgdVac8ieunAe0l2suA8vFDcLnd6nw9HWkX3KUs9nZf0MF_Eq56v8g6bIxISi_WDz6xcKMN27C4moVc_krrUT1XPfx3XzopHrwuqz54EM9SCq0cLX1l8UvNSwKfKRQaHmMpB_yXkTBa9FRxZ7tl036mnoV4N-JOadsWRZ0aJLzlmu9KJyA4je-E3NmzFAwXkYmkiQ4G2O9uIhsRlbcTCSeEI5g8qR3LTVWgPjvM" 
             class="w-full h-full object-cover opacity-20 grayscale brightness-50" />
        <div class="absolute inset-0 hero-gradient opacity-90"></div>
    </div>

    <div class="w-full max-w-md relative z-10 animate-fade-in">
        <div class="glass-effect p-10 rounded-sm shadow-2xl">
            <!-- Branding -->
            <div class="text-center mb-10">
                <a href="index.html" class="inline-flex items-center gap-3 mb-4">
                    <img src="assets/favicon.png" alt="Logo Aly" class="h-10 w-auto object-contain" onerror="this.style.display='none'">
                    <span class="text-3xl font-black tracking-tighter text-white uppercase italic">Comercializadora <span class="text-secondary-container">Aly</span></span>
                </a>
                <h1 class="text-white/60 text-[10px] font-black uppercase tracking-[0.4em]">Portal de Gestión Segura</h1>
            </div>

            <div id="error-message" class="hidden mb-6 p-4 bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-bold uppercase tracking-widest text-center animate-bounce">
                <!-- Error text -->
            </div>

            <!-- Role Selector -->
            <div class="mb-8">
                <p class="text-[10px] font-black uppercase tracking-widest text-white/40 mb-4 px-1">Seleccionar Nivel de Acceso</p>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" class="role-btn group flex flex-col items-center gap-2 p-4 border border-white/10 hover:bg-white/5 transition-all" onclick="selectRole('inversionista', this)">
                        <span class="material-symbols-outlined text-white/50 group-hover:text-secondary-container">payments</span>
                        <span class="text-[9px] font-black uppercase tracking-widest text-white">Inversionista</span>
                    </button>
                    <button type="button" class="role-btn group flex flex-col items-center gap-2 p-4 border border-white/10 hover:bg-white/5 transition-all" onclick="selectRole('comprador', this)">
                        <span class="material-symbols-outlined text-white/50 group-hover:text-secondary-container">shopping_cart</span>
                        <div class="flex flex-col items-center">
                            <span class="text-[9px] font-black uppercase tracking-widest text-white">Comprador</span>
                            <span class="text-[7px] font-black text-secondary-container uppercase tracking-widest mt-0.5">ALICIA</span>
                        </div>
                    </button>
                    <button type="button" class="role-btn group flex flex-col items-center gap-2 p-4 border border-white/10 hover:bg-white/5 transition-all" onclick="selectRole('operador', this)">
                        <span class="material-symbols-outlined text-white/50 group-hover:text-secondary-container">engineering</span>
                        <span class="text-[9px] font-black uppercase tracking-widest text-white">Operador</span>
                    </button>
                    <button type="button" class="role-btn group flex flex-col items-center gap-2 active p-4 border border-white/10 hover:bg-white/5 transition-all" onclick="selectRole('admin', this)">
                        <span class="material-symbols-outlined text-white/50 group-hover:text-secondary-container">admin_panel_settings</span>
                        <span class="text-[9px] font-black uppercase tracking-widest text-white">Admin</span>
                    </button>
                </div>
            </div>

            <!-- Form -->
            <form id="login-form" class="space-y-6">
                <input type="hidden" id="role" value="admin">
                
                <div class="space-y-2">
                    <label for="usuario" class="text-[9px] font-black uppercase tracking-widest text-white/40 ml-1">Identificador de Usuario</label>
                    <div class="relative">
                        <input type="text" id="usuario" required 
                               class="w-full bg-white/5 border border-white/10 p-4 pl-12 text-white font-bold text-sm focus:ring-2 focus:ring-secondary-container focus:border-transparent outline-none transition-all placeholder:text-white/10"
                               placeholder="USUARIO-ID">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-white/20 text-sm">person</span>
                    </div>
                </div>

                <div class="space-y-2">
                    <label for="password" class="text-[9px] font-black uppercase tracking-widest text-white/40 ml-1">Clave de Seguridad</label>
                    <div class="relative">
                        <input type="password" id="password" required 
                               class="w-full bg-white/5 border border-white/10 p-4 pl-12 text-white font-bold text-sm focus:ring-2 focus:ring-secondary-container focus:border-transparent outline-none transition-all placeholder:text-white/10"
                               placeholder="••••••••">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-white/20 text-sm">key</span>
                    </div>
                </div>

                <button type="submit" class="w-full py-5 bg-secondary-container text-white font-black uppercase tracking-[0.3em] text-[10px] hover:bg-secondary transition-all shadow-[0_10px_30px_rgba(253,118,26,0.3)] hover:scale-[1.02] active:scale-95">
                    Autenticar Acceso
                </button>
            </form>

            <div class="mt-12 pt-8 border-t border-white/5 text-center">
                <a href="dashboard.html" class="text-[9px] font-black uppercase tracking-widest text-white/20 hover:text-secondary-container transition-colors">
                    Entrada Directa de Emergencia (Debug)
                </a>
            </div>
        </div>

        <p class="text-center text-white/20 mt-8 text-[8px] font-black uppercase tracking-[0.5em]">
            SISTEMA DE CONTROL ALY © 2026
        </p>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sessionUserId = sessionStorage.getItem('userId');
            const sessionRole = sessionStorage.getItem('userRole');

            if (sessionUserId && sessionRole) {
                if (sessionRole === 'admin') window.location.href = 'dashboard.html';
                else if (sessionRole === 'comprador') window.location.href = 'dashboard-comprador.html';
                else if (sessionRole === 'inversionista') window.location.href = 'dashboard-inversionista.html';
                else if (sessionRole === 'operador') window.location.href = 'pages/dashboard-operador.html';
            }
        });

        let currentRole = 'admin';

        function selectRole(role, btn) {
            currentRole = role;
            document.getElementById('role').value = role;

            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            hideError();
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        function hideError() {
            const errorDiv = document.getElementById('error-message');
            errorDiv.classList.add('hidden');
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;

            try {
                let endpoint = '';
                if (currentRole === 'admin') endpoint = 'admin/login';
                else if (currentRole === 'operador') endpoint = 'operadores/login';
                else endpoint = (currentRole === 'inversionista' ? 'inversionistas' : 'compradores') + '/login';

                const response = await fetch(`${window.API_URL}/api/${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });

                if (!response.ok) {
                    showError('❌ Credenciales Inválidas');
                    return;
                }

                const userData = await response.json();
                
                // Unified Session Storage
                sessionStorage.setItem('userId', userData.id);
                sessionStorage.setItem('userName', userData.nombre);
                sessionStorage.setItem('userRole', currentRole);
                sessionStorage.setItem('userLogin', userData.usuario || usuario);

                if (currentRole === 'operador') {
                    localStorage.setItem('operador_sesion', JSON.stringify(userData));
                    window.location.href = 'pages/dashboard-operador.html';
                } else if (currentRole === 'admin') {
                    window.location.href = 'dashboard.html';
                } else if (currentRole === 'inversionista') {
                    window.location.href = 'dashboard-inversionista.html';
                } else {
                    window.location.href = 'dashboard-comprador.html';
                }

            } catch (error) {
                console.error('Error:', error);
                showError('⚠️ Error de Conexión');
            }
        });
    </script>
</body>
</html>
